<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bhoomi HRMS - System Update</title>
  <link rel="icon" type="image/webp" href="/favicon.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #1c2936;
      font-family: 'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .update-screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* 3 Meshed Interlocking Animated Gears */
    .gears-container {
      width: 200px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .gears-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gear-1 {
      transform-origin: 105px 80px;
      animation: spinCw 10s linear infinite;
    }
    .gear-2 {
      transform-origin: 156px 138px;
      animation: spinCcw 7.5s linear infinite;
    }
    .gear-3 {
      transform-origin: 194px 88px;
      animation: spinCw 5.5s linear infinite;
    }

    @keyframes spinCw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCcw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* Minimalist Typography */
    .update-title {
      font-size: 38px;
      font-weight: 300;
      color: #1c2936;
      letter-spacing: 0.5px;
      margin-bottom: 34px;
      user-select: none;
      text-align: center;
    }

    /* Capsule Progress Bar */
    .capsule-wrapper {
      width: 100%;
      max-width: 580px;
      padding: 0 16px;
    }
    .capsule-bar {
      width: 100%;
      height: 42px;
      border: 2.2px solid #1c2936;
      border-radius: 9999px;
      background: #ffffff;
      padding: 0;
      position: relative;
      overflow: hidden;
    }
    .capsule-fill {
      height: 100%;
      background: #1c2936;
      border-radius: 9999px;
      width: 58%;
      animation: progressAnim 5s ease-in-out infinite alternate;
      transition: width 0.4s ease;
    }

    @keyframes progressAnim {
      0% {
        width: 18%;
      }
      35% {
        width: 48%;
      }
      70% {
        width: 64%;
      }
      100% {
        width: 88%;
      }
    }

    @media (max-width: 640px) {
      .update-title {
        font-size: 30px;
        margin-bottom: 24px;
      }
      .capsule-bar {
        height: 34px;
        border-width: 2px;
      }
      .gears-container {
        width: 160px;
        height: 120px;
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>

  <main class="update-screen">
    <!-- Gears Graphic -->
    <div class="gears-container" aria-hidden="true">
      <svg class="gears-svg" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Big Gear (Gear 1) -->
        <g class="gear-1">
          <rect x="98" y="38" width="14" height="84" rx="3" fill="#1c2936" />
          <rect x="98" y="38" width="14" height="84" rx="3" fill="#1c2936" transform="rotate(45 105 80)" />
          <rect x="98" y="38" width="14" height="84" rx="3" fill="#1c2936" transform="rotate(90 105 80)" />
          <rect x="98" y="38" width="14" height="84" rx="3" fill="#1c2936" transform="rotate(135 105 80)" />
          <circle cx="105" cy="80" r="33" fill="#1c2936" />
          <circle cx="105" cy="80" r="14" fill="#ffffff" />
        </g>

        <!-- Medium Bottom Gear (Gear 2) -->
        <g class="gear-2">
          <rect x="150.5" y="104" width="11" height="68" rx="2.5" fill="#1c2936" transform="rotate(22.5 156 138)" />
          <rect x="150.5" y="104" width="11" height="68" rx="2.5" fill="#1c2936" transform="rotate(67.5 156 138)" />
          <rect x="150.5" y="104" width="11" height="68" rx="2.5" fill="#1c2936" transform="rotate(112.5 156 138)" />
          <rect x="150.5" y="104" width="11" height="68" rx="2.5" fill="#1c2936" transform="rotate(157.5 156 138)" />
          <circle cx="156" cy="138" r="27" fill="#1c2936" />
          <circle cx="156" cy="138" r="11" fill="#ffffff" />
        </g>

        <!-- Small Right Gear (Gear 3) -->
        <g class="gear-3">
          <rect x="189.5" y="62" width="9" height="52" rx="2" fill="#1c2936" />
          <rect x="189.5" y="62" width="9" height="52" rx="2" fill="#1c2936" transform="rotate(45 194 88)" />
          <rect x="189.5" y="62" width="9" height="52" rx="2" fill="#1c2936" transform="rotate(90 194 88)" />
          <rect x="189.5" y="62" width="9" height="52" rx="2" fill="#1c2936" transform="rotate(135 194 88)" />
          <circle cx="194" cy="88" r="20" fill="#1c2936" />
          <circle cx="194" cy="88" r="8" fill="#ffffff" />
        </g>
      </svg>
    </div>

    <!-- Title matching user image -->
    <h1 class="update-title">update...</h1>

    <!-- Capsule Loading Bar matching user image -->
    <div class="capsule-wrapper">
      <div class="capsule-bar" role="progressbar" aria-label="System update in progress">
        <div class="capsule-fill"></div>
      </div>
    </div>
  </main>

  <script>
    // Periodic check to auto-reload once production build is ready
    let checking = false;
    async function checkServerReady() {
      if (checking) return;
      checking = true;
      try {
        const res = await fetch('/?_ping=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          const html = await res.text();
          // When the real React app index.html is deployed, root is present and update... screen is gone
          if (html.includes('id="root"') && !html.includes('update...')) {
            window.location.reload();
          }
        }
      } catch (e) {
        // Build still running
      } finally {
        checking = false;
      }
    }

    // Check every 2.5 seconds
    setInterval(checkServerReady, 2500);

    // Also reload immediately on click anywhere
    document.addEventListener('click', () => {
      checkServerReady();
    });
  </script>
</body>
</html>
